services:

  app-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cinema_db
      MYSQL_USER: cinema_user
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    command: --ssl=0 --require_secure_transport=OFF
    volumes:
      - cinema_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - node_modules_volume:/app/node_modules
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: .devcontainer/Dockerfile
    depends_on:
      app-db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    environment:
      MYSQL_USER: cinema_user
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_DATABASE: cinema_db
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
    # certbotが証明書を更新したら12時間ごとにnginxへ再読み込みさせる
    command: "/bin/sh -c 'while :; do sleep 12h & wait $${!}; nginx -s
      reload; done & nginx -g \"daemon off;\"'" 

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  cinema_db_data:
  node_modules_volume: