services:

  app-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cinema_db
      MYSQL_USER: cinema_user
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    command: --ssl=0 --require_secure_transport=OFF
    volumes:
      - cinema_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    image: ghcr.io/32000-yakuman/cinema-frontend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      - backend

  backend:
    image: ghcr.io/32000-yakuman/cinema-backend:latest
    restart: unless-stopped
    depends_on:
      app-db:
        condition: service_healthy
    environment:
      MYSQL_USER: cinema_user
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cinema_db
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.product}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    # certbotが証明書を更新したら12時間ごとにnginxへ再読み込みさせる
    command: "/bin/sh -c 'while :; do sleep 12h & wait $${!}; nginx -s
      reload; done & nginx -g \"daemon off;\"'" 

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  cinema_db_data: